name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Separate workflow so iOS compilation checks run on macOS without blocking
# the main CI pipeline (macOS runners are slower and more expensive).
jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Compilation check only — no codesign since CI doesn't have Apple certs.
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
