name: poker_hand_suggester
description: A Flutter app that calculates the mathematically optimal poker decision (Fold/Call/Raise).
version: 1.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  camera: ^0.11.0+2
  tflite_flutter: ^0.10.4
  tflite_flutter_helper: ^0.4.4
  image_picker: ^1.1.2
  image: ^4.3.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.4
  intl: ^0.19.0
  uuid: ^4.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/card_detection_model.tflite
    - assets/models/card_labels.txt
