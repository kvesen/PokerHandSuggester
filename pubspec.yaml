# Dependencies are pinned to exact versions for production stability.
# Run `flutter pub outdated` to check for updates.
name: poker_hand_suggester
# App display name: Poker Buddy
description: Poker Buddy - your pocket poker strategy partner for mathematically optimal Fold/Call/Raise decisions.
version: 1.0.0+1    # format: <semver>+<versionCode>

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  shared_preferences: 2.5.4
  intl: 0.19.0
  uuid: 4.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  firebase_core: 3.13.0
  firebase_crashlytics: 4.3.5
  package_info_plus: 10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.2
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.7

flutter:
  uses-material-design: true
